<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Trainer</title>

    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <header class="topo">
            <h1>English Trainer</h1>
            <p>Pratique inglês traduzindo, ouvindo e escrevendo.</p>
        </header>

        <nav class="abas">
            <button
                class="aba ativa"
                data-aba="tradutor"
                type="button"
            >
                Tradutor
            </button>

            <button
                class="aba"
                data-aba="pratica"
                type="button"
            >
                Gerar texto
            </button>
        </nav>

        <section
            id="tradutor"
            class="painel ativo"
        >
            <h2>Tradutor</h2>

            <div class="campo-grupo">
                <label for="direction">
                    Direção da tradução
                </label>

                <select id="direction">
                    <option value="pt-en">
                        Português para inglês
                    </option>

                    <option value="en-pt">
                        Inglês para português
                    </option>
                </select>
            </div>

            <div class="campo-grupo">
                <label for="textInput">
                    Digite o texto
                </label>

                <textarea
                    id="textInput"
                    rows="6"
                    maxlength="500"
                    placeholder="Digite uma frase..."
                ></textarea>
            </div>

            <div class="botoes">
                <button
                    id="translateButton"
                    class="botao principal"
                    type="button"
                >
                    Traduzir
                </button>

                <button
                    id="clearTranslationButton"
                    class="botao secundario"
                    type="button"
                >
                    Limpar
                </button>
            </div>

            <div
                id="translationStatus"
                class="status"
                aria-live="polite"
            ></div>

            <div class="resultado">
                <h3>Tradução</h3>

                <div
                    id="translationResult"
                    class="resultado-texto"
                >
                    A tradução aparecerá aqui.
                </div>
            </div>
        </section>

        <section
            id="pratica"
            class="painel"
        >
            <h2>Prática de escuta e escrita</h2>

            <div class="opcoes-pratica">
                <div class="campo-grupo">
                    <label for="levelSelect">
                        Nível
                    </label>

                    <select id="levelSelect">
                        <option value="beginner">
                            Iniciante
                        </option>

                        <option value="intermediate">
                            Intermediário
                        </option>

                        <option value="advanced">
                            Avançado
                        </option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="topicSelect">
                        Tema
                    </label>

                    <select id="topicSelect">
                        <option value="routine">
                            Rotina
                        </option>

                        <option value="travel">
                            Viagem
                        </option>

                        <option value="restaurant">
                            Restaurante
                        </option>

                        <option value="work">
                            Trabalho
                        </option>

                        <option value="free-time">
                            Tempo livre
                        </option>
                    </select>
                </div>
            </div>

            <button
                id="generateButton"
                class="botao principal largura-total"
                type="button"
            >
                Gerar novo texto
            </button>

            <div class="resultado texto-gerado-box">
                <h3>Texto para ouvir</h3>

                <div
                    id="generatedText"
                    class="texto-gerado"
                >
                    Clique em “Gerar novo texto” para começar.
                </div>
            </div>

            <div class="controles-voz">
                <button
                    id="speakButton"
                    class="botao principal"
                    type="button"
                >
                    ▶ Ouvir
                </button>

                <button
                    id="pauseButton"
                    class="botao secundario"
                    type="button"
                >
                    ⏸ Pausar
                </button>

                <button
                    id="stopButton"
                    class="botao secundario"
                    type="button"
                >
                    ■ Parar
                </button>
            </div>

            <div class="campo-grupo">
                <label for="typingInput">
                    Digite o que você está ouvindo
                </label>

                <textarea
                    id="typingInput"
                    rows="6"
                    placeholder="Digite o texto em inglês enquanto escuta..."
                ></textarea>
            </div>

            <div class="botoes">
                <button
                    id="checkButton"
                    class="botao principal"
                    type="button"
                >
                    Verificar resposta
                </button>

                <button
                    id="clearPracticeButton"
                    class="botao secundario"
                    type="button"
                >
                    Limpar
                </button>
            </div>

            <div
                id="practiceStatus"
                class="status"
                aria-live="polite"
            ></div>

            <div
                id="checkResult"
                class="resultado resultado-verificacao"
            ></div>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
